<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onay Parti</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1b222c;
      --muted: #5c6777;
      --primary: #1d4ed8;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .btn {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    main {
      max-width: 820px;
      margin: 1.25rem auto;
      padding: 0 1rem 2.5rem;
    }

    .status {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    .post-thumb {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #e5e7eb;
    }

    .post-body {
      padding: 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .post-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .post-title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .post-excerpt {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-view {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: none;
    }

    .article-view h2 {
      margin-top: 0;
      line-height: 1.3;
    }

    .article-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 0.75rem 0;
    }

    .article-content {
      overflow-wrap: break-word;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="headerTitle">Onay Parti</h1>
    <button id="backBtn" class="btn" style="display: none;">← Yazılara Dön</button>
  </header>

  <main>
    <div id="status" class="status">Yazılar yükleniyor...</div>
    <div id="postsGrid" class="grid"></div>

    <article id="articleView" class="article-view">
      <div id="articleDate" class="post-date"></div>
      <h2 id="articleTitle"></h2>
      <div id="articleContent" class="article-content"></div>
    </article>
  </main>

  <script>
    const BLOG_URL = "https://onayparti.blogspot.com";
    const FEED_URL = `${BLOG_URL}/feeds/posts/default?alt=json-in-script&max-results=20&callback=renderPosts`;

    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("postsGrid");
    const articleViewEl = document.getElementById("articleView");
    const articleTitleEl = document.getElementById("articleTitle");
    const articleDateEl = document.getElementById("articleDate");
    const articleContentEl = document.getElementById("articleContent");
    const backBtn = document.getElementById("backBtn");

    let cachedPosts = [];

    function extractFirstImage(htmlString) {
      const temp = document.createElement("div");
      temp.innerHTML = htmlString;
      const img = temp.querySelector("img");
      return img ? img.src : null;
    }

    function stripHtml(htmlString) {
      const temp = document.createElement("div");
      temp.innerHTML = htmlString;
      return (temp.textContent || temp.innerText || "").trim();
    }

    function formatDate(isoDate) {
      const d = new Date(isoDate);
      return d.toLocaleDateString("tr-TR", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function openPost(index) {
      const post = cachedPosts[index];
      if (!post) return;

      gridEl.style.display = "none";
      statusEl.style.display = "none";
      articleViewEl.style.display = "block";
      backBtn.style.display = "inline-block";

      articleTitleEl.textContent = post.title;
      articleDateEl.textContent = formatDate(post.published);
      articleContentEl.innerHTML = post.content;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showList() {
      articleViewEl.style.display = "none";
      backBtn.style.display = "none";
      gridEl.style.display = "grid";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    backBtn.addEventListener("click", showList);

    // JSONP ile tarayıcı CORS engeline takılmadan Blogger verisini çeker
    window.renderPosts = function(data) {
      const entries = (data && data.feed && data.feed.entry) || [];
      cachedPosts = entries.map((entry) => {
        const title = entry.title?.$t || "Başlıksız Yazı";
        const content = entry.content?.$t || entry.summary?.$t || "";
        const published = entry.published?.$t || "";
        return { title, content, published };
      });

      if (cachedPosts.length === 0) {
        statusEl.textContent = "Henüz yayınlanmış yazı bulunamadı veya site beslemesi kapalı.";
        return;
      }

      statusEl.style.display = "none";
      gridEl.innerHTML = "";

      cachedPosts.forEach((post, idx) => {
        const card = document.createElement("div");
        card.className = "post-card";
        card.addEventListener("click", () => openPost(idx));

        const thumbUrl = extractFirstImage(post.content);
        if (thumbUrl) {
          const img = document.createElement("img");
          img.className = "post-thumb";
          img.src = thumbUrl;
          img.alt = post.title;
          img.loading = "lazy";
          card.appendChild(img);
        }

        const body = document.createElement("div");
        body.className = "post-body";

        const dateEl = document.createElement("div");
        dateEl.className = "post-date";
        dateEl.textContent = formatDate(post.published);

        const titleEl = document.createElement("h3");
        titleEl.className = "post-title";
        titleEl.textContent = post.title;

        const excerptEl = document.createElement("p");
        excerptEl.className = "post-excerpt";
        excerptEl.textContent = stripHtml(post.content);

        body.appendChild(dateEl);
        body.appendChild(titleEl);
        body.appendChild(excerptEl);
        card.appendChild(body);
        gridEl.appendChild(card);
      });
    };

    const script = document.createElement("script");
    script.src = FEED_URL;
    script.onerror = () => {
      statusEl.textContent = "Yazılar çekilemedi. Blogger site besleme ayarlarını kontrol edin.";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
